name: Docs checks

# Static checks only. This repository contains documentation - nothing is built, installed or executed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: README carries the demo notice
        run: grep -q "Fictional company" README.md || { echo "::error::demo notice missing from README.md"; exit 1; }

      - name: Documentation file types only
        run: |
          bad=$(git ls-files | grep -Ev '\.(md|ya?ml|json|csv|svg|png|pdf|txt)$|(^|/)CODEOWNERS$|(^|/)\.git(ignore|attributes)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::non-documentation files found:"
            echo "$bad"
            exit 1
          fi

      - name: No private keys or tokens committed
        run: |
          if git grep -nE -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}' -- . ':!.github/workflows/*'; then
            echo "::error::possible secret committed"
            exit 1
          fi

      - name: No large files outside Git LFS
        run: |
          big=$(git ls-files -z | xargs -0 -r du -k | awk '$1 > 1024 {print $2}')
          if [ -n "$big" ]; then
            echo "::error::files over 1 MB must be tracked with Git LFS: $big"
            exit 1
          fi
