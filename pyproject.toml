[project]
name = "brumalink-shipment-api"
description = "Shipment, readings and custody-chain API for Brumalink cold chain logistics"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
