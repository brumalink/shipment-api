openapi: 3.1.0
info:
  title: Brumalink Shipment Platform API
  version: "2.0"
  description: Fictional API specification - documentation only.
servers:
  - url: https://api.brumalink.example/v1

paths:
  /shipments:
    get:
      summary: List shipments
      tags: [shipments]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Shipments, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
    post:
      summary: Create a shipment
      tags: [shipments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentCreate"
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "422":
          description: Unknown product profile

  /shipments/{reference}:
    get:
      summary: Get a shipment
      tags: [shipments]
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: The shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "404":
          description: Shipment not found

  /shipments/{reference}/excursions:
    get:
      summary: Temperature excursions of a shipment
      description: Evaluated from raw readings with the rules in docs/excursion-rules.md.
      tags: [excursions]
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Excursions, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Excursion"

  /shipments/{reference}/custody:
    get:
      summary: Chain of custody of a shipment
      description: Hash-chained handover events, see docs/custody-chain.md.
      tags: [custody]
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Custody chain with integrity status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustodyChain"

  /readings:
    post:
      summary: Ingest a batch of tracker readings
      description: Called by the MQTT bridge, see docs/ingestion.md.
      tags: [readings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Reading"
      responses:
        "202":
          description: Batch accepted

  /tenants:
    get:
      summary: List tenants (3PL partners)
      tags: [tenants]
      responses:
        "200":
          description: Tenants ordered by slug
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      summary: Register a tenant
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tenant"
      responses:
        "201":
          description: Tenant registered
        "422":
          description: Invalid slug or unsupported data region

components:
  parameters:
    Reference:
      name: reference
      in: path
      required: true
      schema:
        type: string
        pattern: "^BL-\\d{4}-\\d{6}$"
      example: BL-2025-000123
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    ShipmentStatus:
      type: string
      enum: [created, in_transit, delivered, quarantined]

    ShipmentCreate:
      type: object
      required: [reference, product_profile, origin, destination]
      properties:
        reference:
          type: string
          example: BL-2025-000123
        product_profile:
          type: string
          enum: ["2-8C", "15-25C", "frozen"]
        origin:
          type: string
          example: WAW-HUB-1
        destination:
          type: string
          example: PHARMACY-POZ-0417
        tracker_id:
          type: string
          example: BLT3-00F1A2

    Shipment:
      allOf:
        - $ref: "#/components/schemas/ShipmentCreate"
        - type: object
          properties:
            status:
              $ref: "#/components/schemas/ShipmentStatus"
            min_temp_c:
              type: number
            max_temp_c:
              type: number
            created_at:
              type: string
              format: date-time

    Reading:
      type: object
      required: [tracker_id, sequence, recorded_at, temperature_c]
      properties:
        tracker_id:
          type: string
          example: BLT3-00F1A2
        sequence:
          type: integer
          minimum: 0
          description: Monotonic per tracker
        recorded_at:
          type: string
          format: date-time
        temperature_c:
          type: number
          minimum: -80
          maximum: 80
        humidity_pct:
          type: number
          minimum: 0
          maximum: 100
        battery_pct:
          type: integer
          minimum: 0
          maximum: 100

    Excursion:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        peak_c:
          type: number

    CustodyChain:
      type: object
      properties:
        reference:
          type: string
        intact:
          type: boolean
          description: false if any past event was altered, removed or reordered
        broken_at:
          type: [integer, "null"]
        events:
          type: array
          items:
            type: object
            properties:
              occurred_at:
                type: string
                format: date-time
              from:
                type: string
              to:
                type: string
              location:
                type: string
              signed_by:
                type: string
    Tenant:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,30}[a-z0-9]$"
          example: nordic-3pl
        name:
          type: string
          example: Nordic 3PL Partner (fictional)
        data_region:
          type: string
          enum: [eu-central, eu-north]
          default: eu-central
