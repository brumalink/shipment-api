services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: brumalink
      POSTGRES_PASSWORD: brumalink
      POSTGRES_DB: shipments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      BRUMALINK_DATABASE_URL: postgresql+psycopg://brumalink:brumalink@db:5432/shipments
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
